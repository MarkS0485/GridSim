# GridSim web app behind nginx (example; F05). Replace gridsim.example.com with your host name.
#
# The app listens on 127.0.0.1:5540 in every supported deployment: the Docker Compose file publishes the container
# there (GRIDSIM_PORT, default 5540) and the systemd unit (gridsim-web.example.service) binds the same address, so
# this file works unchanged with either. Blazor Server keeps a SignalR WebSocket open at /_blazor, so the Upgrade /
# Connection headers and a long read timeout are required.
#
# TLS: obtain a certificate for your host (for example `certbot --nginx -d gridsim.example.com`, which adds the
# listen 443 / ssl_certificate lines and the port 80 redirect to this file).
server {
    listen 80;
    listen [::]:80;
    server_name gridsim.example.com;

    # Compress text responses, including proxied ones.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml image/svg+xml application/wasm application/manifest+json application/geo+json;

    # Blazor's /_framework assets are content-fingerprinted, so they can be cached for a long time.
    location ^~ /_framework/ {
        proxy_pass http://127.0.0.1:5540;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
    }

    # The REST API is never cached by the proxy or the browser. A "^~" prefix location stops nginx from trying the
    # regular-expression locations below, so /api/openapi.json (which ends in .json) no longer falls into the one-day
    # static-asset rule (D-DOC-182: before, a stale API document could be served for a day after an upgrade). On a
    # replay-only instance /api answers 404 either way.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5540;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Other static assets are not fingerprinted: a one-day expiry keeps repeat visits cheap without trapping updates.
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|woff2?|ttf|eot|map|wasm|json|geojson)$ {
        proxy_pass http://127.0.0.1:5540;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:5540;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;   # keep the Blazor /_blazor circuit open
    }
}
