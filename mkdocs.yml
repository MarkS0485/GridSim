# MkDocs configuration for the GridSim documentation site.
#
# Build locally (from the repository root):
#   python -m venv .venv-docs
#   .venv-docs/bin/pip install -r requirements-docs.txt     (Scripts/ on Windows)
#   .venv-docs/bin/python -m mkdocs build --strict -d site
#
# The pages are the Markdown files under docs/, untouched. Anything the site
# cannot or should not host is handled by tools/docs/mkdocs_hooks.py, which
# turns links that leave the site into links to the GitHub repository.

site_name: GridSim
site_description: Documentation for GridSim, a power-grid simulator written in C# and .NET.
site_url: https://marks0485.github.io/GridSim/
repo_url: https://github.com/MarkS0485/GridSim
repo_name: MarkS0485/GridSim
# The "edit this page" button opens the file on GitHub.
edit_uri: blob/main/docs/

docs_dir: docs
site_dir: site

# Link checks stay at their defaults (warn), so under "mkdocs build --strict"
# a broken link, a missing anchor or a missing image fails the build.
# Only the "page is not in the nav" notice is downgraded: a few short
# "Moved" stub pages and raw benchmark dumps are deliberately kept out of the
# menu but still build, so links to them keep working.
validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  - tools/docs/mkdocs_hooks.py

theme:
  name: material
  # Landing block for the home page (see tools/docs/site-overrides/main.html).
  custom_dir: tools/docs/site-overrides
  # Use the visitor's own system fonts, so the site makes no requests to
  # third-party font servers.
  font: false
  language: en
  palette:
    # Follow the system light/dark preference by default, with a toggle.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
# pymdownx.arithmatex is not enabled: the docs contain no LaTeX maths.

# Files under docs/ that are NOT copied into the site (gitignore-style
# patterns, relative to docs/).
exclude_docs: |
  # CAF/NIS assurance material: deliberately kept off the public site.
  assurance/
  # Git submodule of third-party GB grid documents (hundreds of MB).
  Public/
  # Third-party PDFs and their catalogue (hundreds of MB; the PDFs are not
  # tracked in git). Links into this folder go to GitHub instead.
  reference/

