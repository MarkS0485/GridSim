name: CodeQL

# F07: static security analysis of the C# code with GitHub CodeQL, run by hand (see Triggers below). Results appear
# under the repository's Security tab ("Code scanning").
# It builds the solution itself (build-mode manual) so the analysed code is exactly what the Release build compiles.
# Triggers (2026-10-04, N176): the repository is private and Mark keeps the free Actions allowance (no upgrade), so
# this workflow no longer runs on every push or pull request. It runs only when started by hand
# (Actions tab or `gh workflow run`). Day-to-day verification is the local three-mode batch run (PLAN.md).
on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Build telemetry off on every leg (Mark, 2026-10-20): Avalonia's opt-out switch. Directory.Build.targets also
# replaces Avalonia.BuildServices' AvaloniaStats target with an empty one; AvaloniaTelemetryOptOutTests pins both.
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  analyse:
    name: Analyse C#
    runs-on: windows-latest     # the desktop app (WPF) is part of the solution and builds natively here
    permissions:
      contents: read
      security-events: write    # upload the results to code scanning
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          # Security rules only (Mark, 2026-10-31). The security-and-quality suite added about 160 code-style rules
          # (Path.Combine, == on doubles, boolean simplification, catch-all ...) that the compiler and the Recommended
          # analysers do not apply; its first run filled the 5000-result upload limit with notes and no security result.
          queries: security-extended
      - name: Build
        run: dotnet build GridSim.slnx -c Release --nologo
      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
