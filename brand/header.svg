    <line x1="150" y1="0" x2="150" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/><line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="750" y1="0" x2="750" y2="500"/><line x1="900" y1="0" x2="900" y2="500"/>
    <line x1="1050" y1="0" x2="1050" y2="500"/><line x1="1200" y1="0" x2="1200" y2="500"/><line x1="1350" y1="0" x2="1350" y2="500"/>
  </g>
  <g opacity=".5" fill="none" stroke-width="4" stroke-linecap="round">
