    <circle cx="980" cy="360" r="9" stroke="#3FA9F5"/><circle cx="1200" cy="360" r="9" stroke="#00B8D4"/>
    <circle cx="1330" cy="150" r="8" stroke="#9B0056"/><circle cx="1360" cy="300" r="7" stroke="#F3C13A"/>
    <circle cx="1080" cy="200" r="11" stroke="#3FA9F5"/>
  </g>
  <line x1="60" y1="430" x2="1440" y2="430" stroke="#F3C13A" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round" opacity=".7"/>
  <text x="72" y="420" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#F3C13A" opacity=".75">LFDD 48.8 Hz</text>
  <path d="M0 300 L560 300 C650 300 690 402 760 405 C835 408 865 250 940 240 C1010 231 1070 300 1160 300 L1500 300"
