      <line x1="12" y1="34" x2="84" y2="34" stroke="#F3C13A" stroke-width="1.6" stroke-dasharray="1 5" opacity=".7"/>
      <path d="M11 40 L38 40 C45 40 49 68 55 69 C61 70 63 34 70 32 C76 30 82 42 86 41" fill="none" stroke="#3FA9F5" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
