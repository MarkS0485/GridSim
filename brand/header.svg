<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1520"/><stop offset="55%" stop-color="#0A0E13"/><stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="70%" cy="18%" r="60%">
      <stop offset="0" stop-color="#123047" stop-opacity=".8"/><stop offset="100%" stop-color="#0A0E13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
